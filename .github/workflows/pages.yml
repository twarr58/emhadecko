name: pages

on:
  push:
    branches: [main]
    paths: [web/**, scripts/**, .github/workflows/pages.yml]
  # výluky a mimořádnosti z RSS pid.cz se obnovují každých 15 minut
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # zastávky a trasy všech linek z jízdního řádu PID (GTFS, ~48 MB) pro linky, které právě nejedou;
      # stahuje se jednou denně (cache podle data), při chybě zůstane včerejší verze z cache
      - id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - id: lines-cache
        uses: actions/cache@v4
        with:
          path: web/lines
          key: pid-lines-${{ steps.day.outputs.d }}
          restore-keys: pid-lines-
      - name: Build PID lines from GTFS
        if: steps.lines-cache.outputs.cache-hit != 'true'
        run: python3 scripts/build_lines.py web/lines || echo "::warning::building lines from GTFS failed, keeping the cached version (if any)"

      # pid.cz RSS nemá CORS, prohlížeč ho nenačte → převedeme ho na web/alerts.json
      # tarifní pásma (IPR Praha) se mění zřídka: obnovit jen při pushi / ručním spuštění;
      # při chybě zůstane web/zones.json z repa
      - name: Refresh tariff zones
        if: github.event_name != 'schedule'
        run: python3 scripts/fetch_zones.py web/zones.json || echo "::warning::tariff zones refresh failed, keeping web/zones.json from the repo"

      - name: Fetch PID alerts
        run: python3 scripts/fetch_alerts.py web/alerts.json || echo '{"items":[],"errors":["fetch failed"]}' > web/alerts.json

      # Konfigurace API pro stránku:
      #  - repo proměnná WORKER_URL (Settings → Variables) → stránka volá Cloudflare Worker
      #    (worker/), klíč drží Worker a do stránky se NEdostane,
      #  - jinak se vloží secret GOLEMIO_API_KEY (veřejně čitelný, přechodné řešení),
      #  - jinak si návštěvník zadá vlastní klíč.
      - name: Configure API
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          GOLEMIO_API_KEY: ${{ secrets.GOLEMIO_API_KEY }}
        run: |
          if [ -n "$WORKER_URL" ]; then
            jq -n --arg u "$WORKER_URL" -r \
              '"window.EMHADECKO_CONFIG = " + ({apiBase: $u, proxy: true, pollSeconds: 10} | tojson) + ";"' \
              > web/config.js
            echo "Using Cloudflare Worker: $WORKER_URL"
          elif [ -n "$GOLEMIO_API_KEY" ]; then
            jq -n --arg k "$GOLEMIO_API_KEY" -r \
              '"window.EMHADECKO_CONFIG = " + ({apiBase: "https://api.golemio.cz", apiKey: $k, pollSeconds: 10} | tojson) + ";"' \
              > web/config.js
            echo "::warning::API key is embedded in the public page; set WORKER_URL to use the Cloudflare Worker"
          else
            echo "No WORKER_URL or GOLEMIO_API_KEY, visitors will enter their own key"
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
