name: pages

on:
  push:
    branches: [main]
    paths: [web/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Secret GOLEMIO_API_KEY se vloží do config.js, aby návštěvníci nemuseli
      # zadávat vlastní klíč. Klíč je tím veřejně čitelný ve zdrojáku stránky
      # (vědomě schválené vlastníkem repa).
      - name: Configure API key
        env:
          GOLEMIO_API_KEY: ${{ secrets.GOLEMIO_API_KEY }}
        run: |
          if [ -z "$GOLEMIO_API_KEY" ]; then
            echo "GOLEMIO_API_KEY not set, visitors will enter their own key"
            exit 0
          fi
          jq -n --arg k "$GOLEMIO_API_KEY" -r \
            '"window.EMHADECKO_CONFIG = " + ({apiBase: "https://api.golemio.cz", apiKey: $k, pollSeconds: 10} | tojson) + ";"' \
            > web/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
