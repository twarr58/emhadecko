name: proxy

on:
  push:
    branches: [main]
    paths: [proxy/**, .github/workflows/proxy.yml]
  pull_request:
    paths: [proxy/**, .github/workflows/proxy.yml]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: proxy/go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: proxy
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/emhadecko-proxy:latest
            ghcr.io/${{ github.repository_owner }}/emhadecko-proxy:${{ github.sha }}
