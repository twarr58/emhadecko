version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /proxy
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: docker
    directory: /proxy
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
      include: scope
