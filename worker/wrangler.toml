name = "emhadecko"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# odkud smí stránka Worker volat (čárkami); localhost je pro lokální vývoj
ALLOWED_ORIGINS = "https://twarr58.github.io,http://localhost:8000"

# rate limit podle IP: běžné používání stránky je ~10–70 požadavků/min
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 180, period = 60 }

# Secret (nedávat sem!): GOLEMIO_API_KEY
#   nastavuje ho workflow .github/workflows/worker.yml ze secretu repa,
#   ručně: npx wrangler secret put GOLEMIO_API_KEY
